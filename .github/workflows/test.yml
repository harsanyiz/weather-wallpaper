name: Test Overflight Images

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Pillow
          python -c "import PIL; print(f'Pillow version: {PIL.__version__}')"
      
      - name: List files before test
        run: |
          echo "=== Fájlok a futás előtt ==="
          ls -la images/ || echo "images mappa nem létezik"
      
      - name: Run test
        run: python test_overflight.py
      
      - name: List files after test
        run: |
          echo "=== Fájlok a futás után ==="
          ls -la images/
          echo "=== current.jpg info ==="
          file images/current.jpg || echo "current.jpg NEM LÉTEZIK!"
      
      - name: Commit and push
        run: |
          git config user.name "test-bot"
          git config user.email "test@bot"
          git add images/current.jpg weather.json
          git status
          git commit -m "Test image $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main
