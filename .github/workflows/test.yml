name: Test Overflight Images

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Teljes history letöltése
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Pillow
      
      - name: Run test
        run: python test_overflight.py
      
      - name: Commit and push with merge handling
        run: |
          git config user.name "test-bot"
          git config user.email "test@bot"
          
          # Újra fetch és pull a legfrissebb változásokért
          git fetch origin main
          git pull --rebase origin main || echo "Pull issue, continuing..."
          
          # Hozzáadás
          git add -f images/current.jpg
          git add -f weather.json
          
          # Commit (ha van változás)
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🧪 Test image $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
