name: Weather Wallpaper Update

on:
  schedule:
    - cron: '5,35 * * * *'  # Minden óra 5. és 35. percében próbálkozik

  workflow_dispatch:      # Manuálisan is indítható

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Engedély a fájlok módosításához

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-core fonts-noto-color-emoji

      - name: Run weather update
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python update_weather.py

      - name: Commit and push changes (safe rebase)
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@weather"

          git add images/current.jpg weather.json

          # Ha nincs változás, nem commitol
          if git diff --staged --quiet; then
            echo "Nincs változás, skip commit"
            exit 0
          fi

          git commit -m "🌤 Időjárás frissítés $(date '+%Y-%m-%d %H:%M')"

          # Biztonságos rebase – NEM írja felül a generált fájlokat
          git fetch origin main
          git rebase origin/main

          # Push
          git push origin main
